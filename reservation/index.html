<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご相談予約 | ライフオン行政書士事務所</title><style>
:root{font-family:"Meiryo","Yu Gothic",sans-serif;color:#23364a;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:24px 16px 56px}header{text-align:center;margin:16px 0 24px}h1{font-size:25px;margin:12px 0}p{line-height:1.7}.panel{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 24px #213e5b12}label{display:block;font-weight:bold;margin:20px 0 8px;font-size:14px}input,select,textarea{width:100%;padding:13px;border:1px solid #bdcbd8;border-radius:9px;font:inherit;background:white}textarea{min-height:95px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#06c755;color:white;font-size:17px;font-weight:bold;margin-top:24px;cursor:pointer}button:disabled{opacity:.55}.small{font-size:12px;color:#64748b}.note{background:#f0f6fc;border-radius:10px;padding:12px;font-size:13px}.status{margin-top:12px;white-space:pre-wrap;font-size:14px}a{color:#1471a6}
</style></head><body><main class="wrap"><header><div>ライフオン行政書士事務所</div><h1>ご相談予約</h1><p class="small">ご希望の日時をお知らせください。<br>送信時点では予約は確定しません。</p></header><section class="panel"><form id="form"><label for="name">お名前（必須）</label><input id="name" maxlength="80" autocomplete="name" required><label for="topic">ご相談内容（必須）</label><select id="topic" required><option value="">選択してください</option><option>相続手続き</option><option>遺言書作成</option><option>その他</option></select><label for="first">第1希望日時（必須）</label><input id="first" type="datetime-local" required><label for="second">第2希望日時（任意）</label><input id="second" type="datetime-local"><label for="method">ご相談方法</label><select id="method"><option>事務所での相談</option><option>電話</option><option>その他・要相談</option></select><label for="memo">ご相談概要（任意）</label><textarea id="memo" maxlength="600" placeholder="ご相談内容をご記入ください。"></textarea><p class="note">お送りいただいた情報は、ご相談予約の連絡・調整のために使用します。予約日時は当事務所からの返信をもって確定します。</p><button id="send" type="submit">LINEで予約内容を送信</button><div id="status" class="status" role="status" aria-live="polite"></div></form></section></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
/* LINE Developersで取得したLIFF IDに差し替えてください */
const LIFF_ID="YOUR_LIFF_ID";
const $=id=>document.getElementById(id);
let ready=false;
(async()=>{if(LIFF_ID==="YOUR_LIFF_ID")return;try{await liff.init({liffId:LIFF_ID});ready=true}catch(e){console.error(e)}})();
$("form").addEventListener("submit",async e=>{e.preventDefault();const value=id=>$(id).value.trim();const date=id=>value(id)?value(id).replace("T"," "):"指定なし";const message="【ライフオン｜相談予約申込み】\nお名前："+value("name")+"\nご相談内容："+value("topic")+"\n第1希望："+date("first")+"\n第2希望："+date("second")+"\nご相談方法："+value("method")+"\nご相談概要："+(value("memo")||"なし");const status=$("status");status.textContent="";$("send").disabled=true;try{if(!ready||!liff.isInClient()||!liff.isApiAvailable("shareTargetPicker")&&!liff.isApiAvailable("sendMessages"))throw Error("LINE内で予約フォームを開き直してください。");if(!liff.isApiAvailable("sendMessages"))throw Error("この画面からは直接送信できません。");await liff.sendMessages([{type:"text",text:message}]);status.textContent="予約申込みをLINEトークに送信しました。当事務所からの返信をお待ちください。";$("send").textContent="送信済み";}catch(err){status.textContent="直接送信できませんでした。以下のボタンで内容をコピーし、ライフオンのLINEトークに貼り付けて送信してください。\n"+(err.message||"");const b=document.createElement("button");b.type="button";b.textContent="予約内容をコピー";b.onclick=async()=>{try{await navigator.clipboard.writeText(message);status.textContent="コピーしました。LINEトークに貼り付けて送信してください。"}catch{status.textContent=message}};status.appendChild(b);$("send").disabled=false;}});</script></body></html>
